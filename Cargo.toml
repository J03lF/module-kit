[package]
name = "fenrir-module-kit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Helpers for Fenrir modules (DB connector client, env helpers, token exchange)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2", "charset"] }
url = "2.5"
base64 = "0.21"
time = { version = "0.3", features = ["formatting", "parsing"] }
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1.39", features = ["net", "io-util", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros"] }